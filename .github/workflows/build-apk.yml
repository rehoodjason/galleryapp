name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Клонирование репозитория
        uses: actions/checkout@v4

      - name: ☕ Установка Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 📱 Настройка Android SDK
        uses: android-actions/setup-android@v3

      - name: 🛠️ Автоматическая настройка Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 🧠 Загрузка модели нейросети MobileFaceNet
        run: |
          mkdir -p app/src/main/assets
          if [ ! -f "app/src/main/assets/mobile_facenet.tflite" ]; then
            echo "Скачивание модели MobileFaceNet..."
            curl -L -o app/src/main/assets/mobile_facenet.tflite "https://github.com/MCarlomagno/FaceRecognitionAuth/raw/master/assets/mobilefacenet.tflite" || touch app/src/main/assets/mobile_facenet.tflite
          fi

      - name: 🔑 Генерация обертки Gradle (если отсутствует)
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper
          fi
          chmod +x ./gradlew

      - name: 🔨 Сборка Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: 📦 Выгрузка готового APK в Артефакты
        uses: actions/upload-artifact@v4
        with:
          name: SmartGallery-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
