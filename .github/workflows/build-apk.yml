name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Клонирование репозитория
        uses: actions/checkout@v4

      - name: ☕ Установка Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 📱 Настройка Android SDK
        uses: android-actions/setup-android@v3

      - name: 🧠 Загрузка модели нейросети (если отсутствует)
        run: |
          mkdir -p app/src/main/assets
          if [ ! -f "app/src/main/assets/mobile_facenet.tflite" ]; then
            curl -L -o app/src/main/assets/mobile_facenet.tflite "https://github.com/MCarlomagno/FaceRecognitionAuth/raw/master/assets/mobilefacenet.tflite" || touch app/src/main/assets/mobile_facenet.tflite
          fi

      - name: ⚡ Кэширование Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 🔑 Выдача прав на выполнение gradlew
        run: chmod +x ./gradlew || true

      - name: 🔨 Сборка Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: 📦 Выгрузка готового APK в Артефакты
        uses: actions/upload-artifact@v4
        with:
          name: SmartGallery-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
